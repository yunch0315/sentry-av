[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentry-av"
version = "0.1.0"
description = "Cross-platform (Windows/macOS) antivirus and anti-ransomware tool with real-time blocking"
requires-python = ">=3.10"
dependencies = ["psutil>=5.9", "watchdog>=3.0", "rich>=13.0"]

[project.optional-dependencies]
yara = ["yara-python>=4.3"]
dev = ["pytest>=7"]

[project.scripts]
sentry = "sentry.cli:main"

[tool.setuptools]
packages = ["sentry", "sentry.scanner", "sentry.realtime"]

[tool.setuptools.package-data]
sentry = ["signatures/*"]
